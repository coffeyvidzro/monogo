name: leamout

x-app-environment: &app-environment
  APP_ENV: production
  LEAMOUT_DEPLOYMENT_ID: ${LEAMOUT_DEPLOYMENT_ID:?LEAMOUT_DEPLOYMENT_ID is required}
  DATABASE_URL: "postgres://leamout:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/leamout?sslmode=disable"
  REDIS_URL: redis://redis:6379/0
  NATS_URL: nats://nats:4222
  NATS_STREAM_REPLICAS: "1"
  FREESWITCH_ESL_ADDRESS: freeswitch:8021
  FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
  CARRIER_CREDENTIAL_ENCRYPTION_KEY: ${CARRIER_CREDENTIAL_ENCRYPTION_KEY:?CARRIER_CREDENTIAL_ENCRYPTION_KEY is required}
  OPERATOR_API_SECRET: ${OPERATOR_API_SECRET:?OPERATOR_API_SECRET is required}
  TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:?TURN_AUTH_SECRET is required}
  TURN_PUBLIC_URLS: ${TURN_PUBLIC_URLS:?TURN_PUBLIC_URLS is required}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leamout
      POSTGRES_USER: leamout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leamout -d leamout"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private-control

  migrate:
    image: arigaio/atlas:1.3.0-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec /atlas migrate apply --dir file:///migrations --url "$$DATABASE_URL"
    environment:
      DATABASE_URL: "postgres://leamout:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/leamout?sslmode=disable&search_path=public"
    volumes:
      - ../../server/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private-control

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - private-control

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ../../containers/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    networks:
      - private-control

  server:
    image: ghcr.io/coffeyvidzro/leamout:${LEAMOUT_VERSION:-preview}
    restart: unless-stopped
    command: ["/leamout/server"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      freeswitch:
        condition: service_started
    networks:
      - public-web
      - private-control

  worker:
    image: ghcr.io/coffeyvidzro/leamout:${LEAMOUT_VERSION:-preview}
    restart: unless-stopped
    command: ["/leamout/worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      freeswitch:
        condition: service_started
    networks:
      - private-control

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_started
    networks:
      - public-web

  freeswitch:
    image: ghcr.io/coffeyvidzro/leamout-freeswitch:${LEAMOUT_VERSION:-preview}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
    volumes:
      - recordings-data:/var/lib/freeswitch/recordings
    networks:
      private-control:
        ipv4_address: 172.32.0.20

  rtpengine:
    image: ghcr.io/coffeyvidzro/leamout-rtpengine:${LEAMOUT_VERSION:-preview}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      RTPENGINE_PUBLIC_IP: ${PUBLIC_IP:?PUBLIC_IP is required}
    ports:
      - "23000-32768:23000-32768/udp"
    networks:
      private-control:
        ipv4_address: 172.32.0.10
      public-media:
        ipv4_address: 172.31.0.10

  opensips:
    image: ghcr.io/coffeyvidzro/leamout-opensips:${LEAMOUT_VERSION:-preview}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SIP_DOMAIN: sip.${DOMAIN:?DOMAIN is required}
    volumes:
      - ./certs/fullchain.pem:/etc/opensips/tls/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/opensips/tls/privkey.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rtpengine:
        condition: service_started
      freeswitch:
        condition: service_started
      server:
        condition: service_started
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "5062:5062/tcp"
    networks:
      private-control: {}
      public-signaling:
        ipv4_address: 172.30.0.10

  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_AUTH_SECRET:?TURN_AUTH_SECRET is required}
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --external-ip=${PUBLIC_IP:?PUBLIC_IP is required}
      - --cert=/etc/coturn/tls/fullchain.pem
      - --pkey=/etc/coturn/tls/privkey.pem
    volumes:
      - ../../containers/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs/fullchain.pem:/etc/coturn/tls/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/coturn/tls/privkey.pem:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    networks:
      - public-media

volumes:
  postgres-data:
  redis-data:
  nats-data:
  recordings-data:
  caddy-data:
  caddy-config:

networks:
  private-control:
    ipam:
      config:
        - subnet: 172.32.0.0/24
  public-media:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  public-signaling:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  public-web:
