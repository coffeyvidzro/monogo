apiVersion: apps/v1
kind: Deployment
metadata:
  name: freeswitch
  namespace: leamout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freeswitch
  template:
    metadata:
      labels:
        app: freeswitch
    spec:
      containers:
        - name: freeswitch
          image: ghcr.io/coffeyvidzro/leamout-freeswitch:preview
          env:
            - name: FREESWITCH_ESL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leamout-secrets
                  key: FREESWITCH_ESL_PASSWORD
          ports:
            - name: esl
              containerPort: 8021
          readinessProbe:
            tcpSocket:
              port: esl
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: esl
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: freeswitch
  namespace: leamout
spec:
  selector:
    app: freeswitch
  ports:
    - name: esl
      port: 8021
      targetPort: esl
