apiVersion: batch/v1
kind: Job
metadata:
  name: leamout-migrate
  namespace: leamout
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: leamout-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U leamout -d leamout; do sleep 2; done"]
      containers:
        - name: migrate
          image: ghcr.io/coffeyvidzro/leamout-migrate:preview
          args:
            - migrate
            - apply
            - --dir
            - file:///migrations
            - --url
            - $(DATABASE_URL)
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leamout-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://leamout:$(POSTGRES_PASSWORD)@postgres:5432/leamout?sslmode=disable&search_path=public
