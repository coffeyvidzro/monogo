apiVersion: apps/v1
kind: Deployment
metadata:
  name: leamout-server
  namespace: leamout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leamout-server
  template:
    metadata:
      labels:
        app: leamout-server
    spec:
      containers:
        - name: server
          image: ghcr.io/coffeyvidzro/leamout:preview
          command: ["/leamout/server"]
          envFrom:
            - configMapRef:
                name: leamout-config
            - secretRef:
                name: leamout-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leamout-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://leamout:$(POSTGRES_PASSWORD)@postgres:5432/leamout?sslmode=disable
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: leamout-server
  namespace: leamout
spec:
  selector:
    app: leamout-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leamout-worker
  namespace: leamout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leamout-worker
  template:
    metadata:
      labels:
        app: leamout-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/coffeyvidzro/leamout:preview
          command: ["/leamout/worker"]
          envFrom:
            - configMapRef:
                name: leamout-config
            - secretRef:
                name: leamout-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leamout-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://leamout:$(POSTGRES_PASSWORD)@postgres:5432/leamout?sslmode=disable
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
