name: Publish containers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: ./server
            dockerfile: ./server/Dockerfile
            build_args: COMMAND=server
          - image: worker
            context: ./server
            dockerfile: ./server/Dockerfile
            build_args: COMMAND=worker
          - image: migrate
            context: ./server
            dockerfile: ./server/Dockerfile.migrate
            build_args: ""
          - image: opensips
            context: ./containers/opensips
            dockerfile: ./containers/opensips/Dockerfile
            build_args: ""
          - image: freeswitch
            context: ./containers/freeswitch
            dockerfile: ./containers/freeswitch/Dockerfile
            build_args: ""
          - image: rtpengine
            context: ./containers/rtpengine
            dockerfile: ./containers/rtpengine/Dockerfile
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/leamout-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
