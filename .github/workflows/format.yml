name: Format and Generate

on:
  push:
    branches:
      - refactor/flat-number-lifecycle-module
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/format.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Format Go sources
        working-directory: server
        run: find . -type f -name '*.go' -print0 | xargs -0 gofmt -w

      - name: Regenerate sqlc
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Set up Atlas
        uses: ariga/setup-atlas@v0.3
        with:
          version: v1.3.0

      - name: Regenerate Atlas checksum
        working-directory: server
        run: atlas migrate hash --dir file://migrations

      - name: Commit generated artifacts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server

          if git diff --cached --quiet; then
            echo "No formatting or generated artifact changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: format and regenerate artifacts"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Run checks on formatted commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          gh workflow run server.yml --ref "$BRANCH"
          gh workflow run docker.yml --ref "$BRANCH"
          gh workflow run vuln.yml --ref "$BRANCH"
