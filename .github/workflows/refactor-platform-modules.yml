name: Refactor platform modules

on:
  push:
    branches:
      - refactor/platform-modules

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Move shared modules into platform
        shell: bash
        run: |
          set -euo pipefail

          for name in audit idempotency outbox webhooks; do
            if [ -e "server/internal/platform/$name" ]; then
              echo "Destination already exists: server/internal/platform/$name" >&2
              exit 1
            fi
            git mv "server/internal/modules/$name" "server/internal/platform/$name"
          done

          git mv server/internal/modules/module.go server/internal/platform/module.go
          git mv server/internal/modules/routes.go server/internal/platform/routes.go
          rmdir server/internal/modules

          mapfile -t files < <(git grep -l 'github.com/coffeyvidzro/monogo/internal/modules' -- server || true)
          if ((${#files[@]})); then
            sed -i 's#github.com/coffeyvidzro/monogo/internal/modules#github.com/coffeyvidzro/monogo/internal/platform#g' "${files[@]}"
          fi

          if git grep -n 'internal/modules' -- server; then
            echo 'Old internal/modules references remain under server/' >&2
            exit 1
          fi

      - name: Commit refactor and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refactor-platform-modules.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: move shared modules into platform'
          git push origin HEAD:${{ github.ref_name }}
