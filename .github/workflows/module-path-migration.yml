name: Module path migration

on:
  push:
    branches:
      - chore/monogo-module-path

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: Replace module imports
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -l 'github.com/leamout/leamout' -- server || true)
          if ((${#files[@]})); then
            sed -i 's#github.com/leamout/leamout#github.com/coffeyvidzro/monogo#g' "${files[@]}"
          fi

          if git grep -n 'github.com/leamout/leamout' -- server; then
            echo 'Old module path still exists under server/' >&2
            exit 1
          fi

      - name: Test server
        id: tests
        shell: bash
        run: |
          set +e
          cd server
          go test ./...
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit migration and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/module-path-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: migrate internal imports to monogo module path'
          git push origin HEAD:${{ github.ref_name }}

      - name: Report test failure
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: |
          echo 'go test ./... failed after the module path migration' >&2
          exit 1
