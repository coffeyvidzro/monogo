name: Docker

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - runtime
          - migrate

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build ${{ matrix.target }} image
        run: |
          docker build \
            --target "${{ matrix.target }}" \
            --file server/Dockerfile \
            --tag "monogo-${{ matrix.target }}:ci" \
            server
