name: BYOC v1 acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - "containers/**"
      - "tests/byoc-v1/**"
      - ".github/workflows/byoc-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: byoc-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  carrier-call-path:
    name: BYOC inbound and outbound calls
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate BYOC acceptance scripts
        run: |
          sh -n tests/byoc-v1/run.sh
          python3 -m py_compile tests/byoc-v1/acceptance.py

      - name: Run BYOC v1 acceptance suite
        run: sh tests/byoc-v1/run.sh
