name: Publish self-hosted bundle

on:
  pull_request:
    paths:
      - ".github/workflows/self-hosted-release.yml"
      - "deploy/docker/**"
      - "server/scripts/**"
      - "server/cmd/leamout/**"
      - "server/internal/installer/**"
      - "server/migrations/**"
      - "containers/nats/**"
      - "containers/coturn/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test installer
        working-directory: server
        run: go test ./internal/installer ./cmd/leamout/commands

      - name: Validate bootstrap script
        run: sh -n server/scripts/install.sh

      - name: Build bundle
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="preview"
          fi

          os="linux"
          arch="amd64"
          bundle="leamout_${version}_${os}_${arch}"
          root="dist/${bundle}"

          mkdir -p \
            "${root}/deploy/docker" \
            "${root}/server" \
            "${root}/containers/nats" \
            "${root}/containers/coturn"

          (
            cd server
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "../${root}/leamout" \
              ./cmd/leamout
          )

          cp deploy/docker/compose.yaml "${root}/deploy/docker/compose.yaml"
          cp deploy/docker/Caddyfile "${root}/deploy/docker/Caddyfile"
          cp -R server/migrations "${root}/server/migrations"
          cp containers/nats/nats-server.conf "${root}/containers/nats/nats-server.conf"
          cp containers/coturn/turnserver.conf "${root}/containers/coturn/turnserver.conf"
          cp deploy/docker/SELF_HOSTED.md "${root}/README.md"
          printf '%s\n' "${version}" > "${root}/VERSION"

          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          (
            cd dist
            sha256sum "${bundle}.tar.gz" > checksums.txt
          )

      - name: Install Minisign
        if: github.ref_type == 'tag'
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign and verify release manifest
        if: github.ref_type == 'tag'
        shell: bash
        env:
          LEAMOUT_MINISIGN_SECRET_KEY: ${{ secrets.LEAMOUT_MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${LEAMOUT_MINISIGN_SECRET_KEY:-}" ]]; then
            echo "LEAMOUT_MINISIGN_SECRET_KEY is required for tagged releases" >&2
            exit 1
          fi

          key_file="${RUNNER_TEMP}/leamout-release.key"
          trap 'rm -f "$key_file"' EXIT
          umask 077

          # Preserve the secret exactly as stored, except normalize CRLF copied
          # from Windows. Do not append an extra newline: Minisign expects the
          # secret key file to contain exactly its two canonical lines.
          printf '%s' "$LEAMOUT_MINISIGN_SECRET_KEY" | tr -d '\r' > "$key_file"
          chmod 0600 "$key_file"

          if ! head -n 1 "$key_file" | grep -Eq '^untrusted comment: minisign (encrypted )?secret key '; then
            echo "LEAMOUT_MINISIGN_SECRET_KEY does not contain a Minisign secret key file" >&2
            exit 1
          fi
          if [[ "$(awk 'END { print NR }' "$key_file")" -ne 2 ]]; then
            echo "LEAMOUT_MINISIGN_SECRET_KEY must contain exactly the two lines from leamout-release.key" >&2
            exit 1
          fi
          if ! sed -n '2p' "$key_file" | grep -Eq '^[A-Za-z0-9+/=]{180,}$'; then
            echo "LEAMOUT_MINISIGN_SECRET_KEY has an invalid key payload" >&2
            exit 1
          fi

          minisign -S -W \
            -s "$key_file" \
            -m dist/checksums.txt \
            -x dist/checksums.txt.minisig \
            -t "Leamout ${GITHUB_REF_NAME} release checksums"

          public_key=$(awk -F"'" '/^minisign_public_key=/{for (i=2; i<=NF; i+=2) printf "%s", $i; print ""; exit}' server/scripts/install.sh)
          if [[ -z "$public_key" ]]; then
            echo "could not read Minisign public key from server/scripts/install.sh" >&2
            exit 1
          fi

          minisign -V \
            -m dist/checksums.txt \
            -x dist/checksums.txt.minisig \
            -P "$public_key" \
            -q

          (
            cd dist
            sha256sum -c checksums.txt
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: leamout-linux-amd64
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.minisig
          if-no-files-found: error

      - name: Attach bundle to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.minisig
