name: Publish self-hosted bundle

on:
  pull_request:
    paths:
      - ".github/workflows/self-hosted-release.yml"
      - "deploy/docker/**"
      - "server/scripts/**"
      - "server/cmd/leamout/**"
      - "server/internal/installer/**"
      - "server/migrations/**"
      - "containers/nats/**"
      - "containers/coturn/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test installer
        working-directory: server
        run: go test ./internal/installer ./cmd/leamout/commands

      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n server/scripts/install.sh
          for script in server/scripts/certs/*.sh server/scripts/deploy/*.sh; do
            sh -n "$script"
          done
          for script in server/scripts/release/*.sh; do
            bash -n "$script"
          done

      - name: Build and verify bundle
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="preview"
          fi

          archive=$(bash server/scripts/release/build-bundle.sh "$version" linux amd64)
          bash server/scripts/release/verify-bundle.sh "$archive"

      - name: Install Minisign
        if: github.ref_type == 'tag'
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign and verify release manifest
        if: github.ref_type == 'tag'
        shell: bash
        env:
          LEAMOUT_MINISIGN_SECRET_KEY: ${{ secrets.LEAMOUT_MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${LEAMOUT_MINISIGN_SECRET_KEY:-}" ]]; then
            echo "LEAMOUT_MINISIGN_SECRET_KEY is required for tagged releases" >&2
            exit 1
          fi

          key_file="${RUNNER_TEMP}/leamout-release.key"
          trap 'rm -f "$key_file"' EXIT
          umask 077

          printf '%s' "$LEAMOUT_MINISIGN_SECRET_KEY" | tr -d '\r' > "$key_file"
          chmod 0600 "$key_file"

          if ! head -n 1 "$key_file" | grep -Eq '^untrusted comment: minisign (encrypted )?secret key '; then
            echo "LEAMOUT_MINISIGN_SECRET_KEY does not contain a Minisign secret key file" >&2
            exit 1
          fi
          if [[ "$(awk 'END { print NR }' "$key_file")" -ne 2 ]]; then
            echo "LEAMOUT_MINISIGN_SECRET_KEY must contain exactly the two lines from leamout-release.key" >&2
            exit 1
          fi
          if ! sed -n '2p' "$key_file" | grep -Eq '^[A-Za-z0-9+/=]{180,}$'; then
            echo "LEAMOUT_MINISIGN_SECRET_KEY has an invalid key payload" >&2
            exit 1
          fi

          minisign -S -W \
            -s "$key_file" \
            -m dist/checksums.txt \
            -x dist/checksums.txt.minisig \
            -t "Leamout ${GITHUB_REF_NAME} release checksums"

          public_key=$(awk -F"'" '/^minisign_public_key=/{for (i=2; i<=NF; i+=2) printf "%s", $i; print ""; exit}' server/scripts/install.sh)
          if [[ -z "$public_key" ]]; then
            echo "could not read Minisign public key from server/scripts/install.sh" >&2
            exit 1
          fi

          minisign -V \
            -m dist/checksums.txt \
            -x dist/checksums.txt.minisig \
            -P "$public_key" \
            -q

          (
            cd dist
            sha256sum -c checksums.txt
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: leamout-linux-amd64
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.minisig
          if-no-files-found: error

      - name: Attach bundle to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.minisig
