name: Refactor command entrypoints

on:
  push:
    branches:
      - refactor/cmd-entrypoints

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Rename command directories
        shell: bash
        run: |
          set -euo pipefail
          git mv server/cmd/cloud server/cmd/server
          git mv server/cmd/hosted server/cmd/leamout

          mapfile -t files < <(git grep -l 'github.com/coffeyvidzro/monogo/cmd/hosted' -- server || true)
          if ((${#files[@]})); then
            sed -i 's#github.com/coffeyvidzro/monogo/cmd/hosted#github.com/coffeyvidzro/monogo/cmd/leamout#g' "${files[@]}"
          fi

          sed -i 's/Use:   "hosted"/Use:   "leamout"/' server/cmd/leamout/commands/root.go

          if git grep -n 'cmd/hosted' -- server; then
            echo 'Old hosted command path remains' >&2
            exit 1
          fi

      - name: Commit refactor and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refactor-cmd-entrypoints.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rename backend command entrypoints'
          git push origin HEAD:${{ github.ref_name }}
