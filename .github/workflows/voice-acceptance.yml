name: Voice v1 acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - "containers/**"
      - "tests/voice-v1/**"
      - ".github/workflows/voice-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: voice-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Leamout Core programmable voice
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Voice v1 acceptance scripts
        run: |
          sh -n tests/voice-v1/run.sh
          python3 -m py_compile tests/voice-v1/acceptance.py
          python3 -m py_compile tests/voice-v1/webhook_receiver.py

      - name: Run Voice v1 acceptance suite
        run: sh tests/voice-v1/run.sh
