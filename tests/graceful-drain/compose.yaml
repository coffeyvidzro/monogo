services:
  opensips:
    environment:
      OPENSIPS_ADVERTISED_ADDRESS: opensips
    volumes:
      - ${GRACEFUL_DRAIN_SUITE_DIR:?GRACEFUL_DRAIN_SUITE_DIR is required}/certs/fullchain.pem:/etc/opensips/tls/fullchain.pem:ro
      - ${GRACEFUL_DRAIN_SUITE_DIR:?GRACEFUL_DRAIN_SUITE_DIR is required}/certs/privkey.pem:/etc/opensips/tls/privkey.pem:ro
      - ${GRACEFUL_DRAIN_SUITE_DIR:?GRACEFUL_DRAIN_SUITE_DIR is required}/certs/carrier-ca.pem:/etc/opensips/tls/carrier-ca.pem:ro

  rtpengine:
    ports: !reset []

  graceful-drain-carrier:
    image: leamout/graceful-drain-carrier:dev
    build:
      context: ../../containers/freeswitch
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
    volumes:
      - ${GRACEFUL_DRAIN_SUITE_DIR:?GRACEFUL_DRAIN_SUITE_DIR is required}/carrier-dialplan.xml:/leamout-config/dialplan/leamout.xml:ro
      - ${GRACEFUL_DRAIN_SUITE_DIR:?GRACEFUL_DRAIN_SUITE_DIR is required}/carrier-sip-profile.xml:/leamout-config/sip_profiles/internal.xml:ro
    networks:
      public-signaling:
        ipv4_address: 172.30.0.50
      public-media:
        ipv4_address: 172.31.0.50
