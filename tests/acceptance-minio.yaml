# Acceptance-only override: the untagged quay.io/minio/minio image in
# deploy/compose.yaml currently returns HTTP 401 to GitHub-hosted runners.
# Use a publicly published mirror of the SAME upstream MinIO release for
# disposable test stacks. Production Compose image configuration is unchanged.
services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
    # The mirrored minimal image bundles mc but does not guarantee curl.
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
