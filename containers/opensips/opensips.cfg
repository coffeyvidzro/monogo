#
# Leamout CPaaS - Core SIP Edge Router
# OpenSIPS 4.0
# Philosophy: fail-closed, fraud-resistant, media-anchored.
#

####### Global Parameters #########
log_level = 3
xlog_level = 3
stderror_enabled = yes
syslog_enabled = no

udp_workers = 4
tcp_workers = 2

socket = udp:0.0.0.0:5060
socket = tcp:0.0.0.0:5060
socket = tls:0.0.0.0:5061
# Browser SIP signaling is TLS-only.  Plain WebSocket is intentionally not
# exposed; WebRTC clients must use wss:// on this listener.
socket = wss:0.0.0.0:5062

# Debian multiarch packages install OpenSIPS modules here.
mpath = "/usr/lib/x86_64-linux-gnu/opensips/modules/"

# If OpenSIPS is behind a NAT/load balancer, set these to the externally
# reachable SIP address. This is SIP signaling, not RTP/SDP addressing.
# advertised_address = <PUBLIC_SIP_IP>
# advertised_port = 5060

####### Modules #########
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "dialog.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "db_postgres.so"
loadmodule "sqlops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "uac_auth.so"
loadmodule "uac.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "rtpengine.so"
loadmodule "pike.so"
loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "tls_openssl.so"
loadmodule "tls_mgm.so"
loadmodule "proto_tls.so"
loadmodule "proto_wss.so"
loadmodule "rest_client.so"
loadmodule "json.so"

include_file "tls.cfg"

####### Module Parameters #########
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
modparam("rr", "append_fromtag", 1)

# Must match the selected deployment Compose file exactly.
modparam("sqlops", "db_url", "postgres://leamout:leamout@postgres:5432/leamout")
modparam("auth_db", "db_url", "postgres://leamout:leamout@postgres:5432/leamout")
# Leamout owns the subscribers schema, so it does not carry OpenSIPS' version table.
modparam("auth_db", "skip_version_check", 1)
modparam("auth_db", "user_column", "username")
modparam("auth_db", "domain_column", "domain")
modparam("auth_db", "password_column", "ha1_md5")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "use_domain", 1)

# Outbound carrier credentials are loaded per transaction from the runtime HA1
# view. uac_auth accepts the 0x-prefixed HA1 and never needs plaintext.
modparam("uac_auth", "auth_username_avp", "$avp(carrier_auth_username)")
modparam("uac_auth", "auth_realm_avp", "$avp(carrier_auth_realm)")
modparam("uac_auth", "auth_password_avp", "$avp(carrier_auth_password)")

# Must match containers/rtpengine/rtpengine.conf.
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:22222")
modparam("rtpengine", "rtpengine_retr", 5)

# Source-IP flood protection at the public SIP edge. This is not a customer
# CPS limit: pike counts every SIP request and its effective IPv4/IPv6 density
# thresholds differ. Tune these starting values against measured edge traffic.
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 200)
modparam("pike", "remove_latency", 120)
modparam("rest_client", "connection_timeout", 1)
modparam("rest_client", "curl_timeout", 2)

####### Main Routing #########
route {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }

    if ($si != "172.32.0.20" && !pike_check_req()) {
        xlog("L_WARN", "SECURITY: SIP edge flood guard triggered for $si transport=$socket_in(proto) method=$rm\n");
        if ($socket_in(proto) != "UDP") {
            append_to_reply("Retry-After: 5\r\n");
            sl_send_reply(503, "Temporarily Overloaded");
        }
        exit;
    }

    if (has_totag()) {
        if (!loose_route()) {
            send_reply(404, "Not Here");
            exit;
        }
        if ($DLG_status == NULL && !match_dialog()) {
            send_reply(481, "Call/Transaction Does Not Exist");
            exit;
        }
        if (!is_method("ACK") && !validate_dialog()) {
            $var(dialog_validation_rc) = $rc;
            if ($var(dialog_validation_rc) == -2 || $var(dialog_validation_rc) == -3) {
                fix_route_dialog();
                if (!validate_dialog()) {
                    send_reply(403, "Invalid Dialog");
                    exit;
                }
            } else {
                send_reply(403, "Invalid Dialog");
                exit;
            }
        }
        if (is_method("INVITE|ACK") && has_body("application/sdp")) {
            if (!rtpengine_manage("replace-origin replace-session-connection")) {
                send_reply(500, "Media Relay Error");
                exit;
            }
        }
        if (is_method("BYE|CANCEL")) {
            rtpengine_delete();
        }
        route(RELAY);
        exit;
    }

    t_check_trans();

    if (loose_route()) {
        send_reply(403, "Preload Route Denied");
        exit;
    }

    if (is_method("OPTIONS") && is_myself("$rd") && $rU == NULL) {
        send_reply(200, "OK");
        exit;
    }

    if (is_method("REGISTER")) {
        if (!www_authorize("", "subscribers")) {
            www_challenge("", "auth");
            exit;
        }
        if ($au != $tU) {
            send_reply(403, "SIP Identity Mismatch");
            exit;
        }
        consume_credentials();
        if (!save("location")) {
            send_reply(500, "Registration Failed");
        }
        exit;
    }

    if (!is_method("INVITE|MESSAGE")) {
        send_reply(405, "Method Not Allowed");
        exit;
    }

    # Trusted application-originated PSTN egress. This path supports both BYOC
    # and Leamout-managed carrier routes selected by the control plane.
    if (is_method("INVITE") && $si == "172.32.0.20") {
        if ($hdr(X-Leamout-Route-URI) == NULL || $hdr(X-Leamout-Route-URI) == ""
                || $hdr(X-Leamout-Carrier-Connection-ID) == NULL
                || $hdr(X-Leamout-Carrier-Connection-ID) !~ "^[0-9a-fA-F-]{36}$") {
            send_reply(403, "Missing Leamout Route");
            exit;
        }
        sql_query_one(
            "SELECT username, realm, password FROM opensips_outbound_carrier_credentials WHERE carrier_connection_id = '$hdr(X-Leamout-Carrier-Connection-ID)'::UUID",
            "$avp(carrier_auth_username);$avp(carrier_auth_realm);$avp(carrier_auth_password)"
        );
        $avp(carrier_route_uri) = $hdr(X-Leamout-Route-URI);
        if (!create_dialog()) {
            send_reply(500, "Dialog Tracking Failed");
            exit;
        }
        if (has_body("application/sdp")) {
            if ($hdr(X-Leamout-Media-Encryption) == "sdes_srtp") {
                $var(rtp_offer_flags) = "in-iface=internal out-iface=external replace-origin replace-session-connection ICE=remove RTP/SAVP";
            } else {
                $var(rtp_offer_flags) = "in-iface=internal out-iface=external replace-origin replace-session-connection ICE=remove RTP/AVP";
            }
            if (!rtpengine_offer($var(rtp_offer_flags))) {
                send_reply(500, "Media Proxy Error");
                exit;
            }
        }
        $du = $avp(carrier_route_uri);
        remove_hf("P-Asserted-Identity");
        remove_hf("P-Preferred-Identity");
        append_hf("P-Asserted-Identity: <$fu>\r\n");
        if ($hdr(X-Leamout-Privacy) == "id") {
            remove_hf("Privacy");
            append_hf("Privacy: id\r\n");
        }
        remove_hf("X-Leamout-Route-URI");
        remove_hf("X-Leamout-Carrier-Connection-ID");
        remove_hf("X-Leamout-Privacy");
        remove_hf("X-Leamout-Media-Encryption");
        record_route();
        t_on_reply("pstn_reply");
        t_on_failure("pstn_failure");
        route(RELAY);
        exit;
    }

    # Carrier ingress supports organization-owned BYOC connections and
    # platform-owned managed connections.
    if (is_method("INVITE")) {
        if (sql_query_one(
                "WITH matches AS (SELECT cc.id, cc.scope, max(masklen(src.cidr)) AS specificity FROM carrier_connection_source_ips AS src JOIN carrier_connections AS cc ON cc.id = src.carrier_connection_id WHERE '$si'::INET <<= src.cidr AND src.organization_id IS NOT DISTINCT FROM cc.organization_id AND cc.status = 'active' AND cc.inbound_enabled = true AND cc.inbound_auth_method = 'ip' GROUP BY cc.id, cc.scope), best AS (SELECT max(specificity) AS specificity FROM matches), resolved AS (SELECT matches.id, matches.scope FROM matches JOIN best USING (specificity)) SELECT id::text, scope FROM resolved WHERE (SELECT count(*) FROM resolved) = 1 LIMIT 1",
                "$avp(carrier_connection_id);$avp(carrier_scope)"
            )) {
            route(CARRIER_INGRESS);
            exit;
        }
        if ($hdr(Proxy-Authorization) != NULL
                && proxy_authorize("", "opensips_inbound_carrier_credentials")) {
            if (!sql_query_one(
                    "SELECT cred.carrier_connection_id::text, cc.scope FROM opensips_inbound_carrier_credentials AS cred JOIN carrier_connections AS cc ON cc.id = cred.carrier_connection_id WHERE cred.username = '$(au{s.escape.common})' AND cred.domain = '$(ar{s.escape.common})' LIMIT 1",
                    "$avp(carrier_connection_id);$avp(carrier_scope)"
                )) {
                send_reply(403, "Carrier Identity Unavailable");
                exit;
            }
            consume_credentials();
            route(CARRIER_INGRESS);
            exit;
        }
    }

    # Managed trunks authenticate with Leamout-issued SIP credentials and are
    # admitted by the control plane before a platform carrier route is used.
    if (is_method("INVITE") && $hdr(Proxy-Authorization) != NULL
            && proxy_authorize("", "opensips_managed_trunk_credentials")) {
        rest_append_hf("Authorization: Bearer __MANAGED_SIP_ADMISSION_SECRET__");
        $var(edge_rest_rc) = rest_post(
            "http://server:8080/internal/v1/sip-edge/authorize",
            "{\"username\":\"$(au{s.escape.common})\",\"realm\":\"$(ar{s.escape.common})\",\"from\":\"$(fU{s.escape.common})\",\"to\":\"$(rU{s.escape.common})\"}",
            "application/json",
            $var(edge_response),
            $var(edge_content_type),
            $var(edge_status)
        );
        if ($var(edge_rest_rc) < 0) {
            send_reply(503, "Authorization Unavailable");
            exit;
        }
        if ($var(edge_status) != 200) {
            send_reply(403, "Call Not Authorized");
            exit;
        }
        $json(edge_response) := $var(edge_response);
        if ($json(edge_response/allowed) != "true"
                || $json(edge_response/route_uri) == NULL
                || $json(edge_response/carrier_connection_id) == NULL) {
            send_reply(403, "Call Not Authorized");
            exit;
        }
        $avp(carrier_route_uri) = $json(edge_response/route_uri);
        $avp(carrier_connection_id) = $json(edge_response/carrier_connection_id);
        consume_credentials();
        if (!create_dialog()) {
            send_reply(500, "Dialog Tracking Failed");
            exit;
        }
        if (has_body("application/sdp") && !rtpengine_offer("in-iface=external out-iface=external replace-origin replace-session-connection ICE=remove RTP/AVP")) {
            send_reply(500, "Media Proxy Error");
            exit;
        }
        $du = $avp(carrier_route_uri);
        remove_hf("P-Asserted-Identity");
        remove_hf("P-Preferred-Identity");
        append_hf("P-Asserted-Identity: <$fu>\r\n");
        record_route();
        t_on_reply("pstn_reply");
        t_on_failure("pstn_failure");
        route(RELAY);
        exit;
    }

    if (!proxy_authorize("", "subscribers")) {
        proxy_challenge("", "auth");
        exit;
    }

    if ($au != $fU) {
        send_reply(403, "SIP Identity Mismatch");
        exit;
    }

    consume_credentials();

    if (is_method("INVITE")) {
        if (!create_dialog()) {
            send_reply(500, "Dialog Tracking Failed");
            exit;
        }
        if (has_body("application/sdp")) {
            if ($socket_in(proto) == "WSS") {
                $avp(leamout_webrtc) = 1;
                if (!rtpengine_offer("in-iface=external out-iface=internal replace-origin replace-session-connection ICE=remove RTP/AVP rtcp-mux-demux")) {
                    send_reply(500, "Media Proxy Error");
                    exit;
                }
            } else if (!rtpengine_offer("replace-origin replace-session-connection ICE=force")) {
                send_reply(500, "Media Proxy Error");
                exit;
            }
        }
        if ($rU == "9196") {
            $du = "sip:freeswitch:5060";
            record_route();
            if ($avp(leamout_webrtc) != NULL) {
                t_on_reply("webrtc_reply");
                t_on_failure("webrtc_failure");
            }
            route(RELAY);
            exit;
        }
        if (db_does_uri_exist($ru, "subscribers")) {
            record_route();
            if (!lookup("location", "method-filtering")) {
                send_reply(404, "Not Registered");
                exit;
            }
            if ($avp(leamout_webrtc) != NULL) {
                t_on_reply("webrtc_reply");
                t_on_failure("webrtc_failure");
            }
            route(RELAY);
            exit;
        }
        send_reply(404, "Destination Not Provisioned or No Carrier Route");
        exit;
    }

    if (db_does_uri_exist($ru, "subscribers")) {
        if (!lookup("location", "method-filtering")) {
            send_reply(404, "Not Registered");
            exit;
        }
        route(RELAY);
        exit;
    }

    send_reply(404, "Not Found");
}

####### Carrier Ingress #########
route[CARRIER_INGRESS] {
    if ($rU == NULL || $rU !~ "^\\+[1-9][0-9]{6,14}$") {
        send_reply(404, "Unknown Called Number");
        exit;
    }

    if (!sql_query_one(
            "SELECT pn.organization_id::text, pn.id::text, vb.id::text, va.id::text, va.ring_timeout_seconds::text FROM phone_numbers AS pn JOIN carrier_connections AS cc ON cc.id = pn.carrier_connection_id JOIN voice_bindings AS vb ON vb.phone_number_id = pn.id JOIN voice_applications AS va ON va.id = vb.voice_application_id JOIN organizations AS o ON o.id = pn.organization_id WHERE pn.number = '$rU' AND pn.carrier_connection_id = '$avp(carrier_connection_id)'::UUID AND pn.status = 'active' AND pn.voice_enabled = true AND cc.status = 'active' AND cc.inbound_enabled = true AND ((cc.scope = 'organization' AND pn.provisioning_mode = 'byoc' AND cc.organization_id = pn.organization_id) OR (cc.scope = 'platform' AND pn.provisioning_mode = 'managed' AND cc.organization_id IS NULL)) AND va.organization_id = pn.organization_id AND va.status = 'active' AND o.status = 'active' AND o.deleted_at IS NULL LIMIT 1",
            "$avp(carrier_org_id);$avp(phone_number_id);$avp(voice_binding_id);$avp(voice_application_id);$avp(ring_timeout_seconds)"
        )) {
        send_reply(404, "No Voice Route");
        exit;
    }

    if (!create_dialog()) {
        send_reply(500, "Dialog Tracking Failed");
        exit;
    }

    remove_hf("X-Leamout-Organization-ID");
    remove_hf("P-Asserted-Identity");
    remove_hf("P-Preferred-Identity");
    remove_hf("X-Leamout-Carrier-Connection-ID");
    remove_hf("X-Leamout-Phone-Number-ID");
    remove_hf("X-Leamout-Voice-Binding-ID");
    remove_hf("X-Leamout-Voice-Application-ID");
    remove_hf("X-Leamout-Ring-Timeout-Seconds");
    append_hf("X-Leamout-Organization-ID: $avp(carrier_org_id)\r\n");
    append_hf("X-Leamout-Carrier-Connection-ID: $avp(carrier_connection_id)\r\n");
    append_hf("X-Leamout-Phone-Number-ID: $avp(phone_number_id)\r\n");
    append_hf("X-Leamout-Voice-Binding-ID: $avp(voice_binding_id)\r\n");
    append_hf("X-Leamout-Voice-Application-ID: $avp(voice_application_id)\r\n");
    append_hf("X-Leamout-Ring-Timeout-Seconds: $avp(ring_timeout_seconds)\r\n");

    if (has_body("application/sdp")) {
        if (!rtpengine_offer("in-iface=external out-iface=internal replace-origin replace-session-connection ICE=remove")) {
            send_reply(500, "Media Proxy Error");
            exit;
        }
    }

    $du = "sip:freeswitch:5060";
    record_route();
    t_on_reply("carrier_ingress_reply");
    t_on_failure("carrier_ingress_failure");
    route(RELAY);
    exit;
}

####### Relay Route #########
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

####### Reply / Failure Routes #########
onreply_route[pstn_reply] {
    if (has_body("application/sdp")) {
        if (!rtpengine_answer("replace-origin replace-session-connection ICE=remove")) {
            xlog("L_ERR", "RTPengine outbound answer failed for Call-ID $ci\n");
        }
    }
    if (t_check_status("[3-6][0-9][0-9]") && !t_check_status("401|407")) {
        rtpengine_delete();
    }
}

failure_route[pstn_failure] {
    if (t_check_status("401|407")
            && $avp(carrier_auth_attempted) == NULL
            && $avp(carrier_auth_password) != NULL
            && $avp(carrier_route_uri) != NULL) {
        $avp(carrier_auth_attempted) = 1;
        if (uac_auth("MD5,MD5-sess")) {
            $du = $avp(carrier_route_uri);
            t_on_reply("pstn_reply");
            t_on_failure("pstn_failure");
            if (t_relay()) {
                exit;
            }
        }
    }
    rtpengine_delete();
}

onreply_route[carrier_ingress_reply] {
    if (has_body("application/sdp")) {
        if (!rtpengine_answer("replace-origin replace-session-connection ICE=remove")) {
            xlog("L_ERR", "RTPengine carrier ingress answer failed for Call-ID $ci\n");
        }
    }
    if (t_check_status("[3-6][0-9][0-9]")) {
        rtpengine_delete();
    }
}

failure_route[carrier_ingress_failure] {
    rtpengine_delete();
}

onreply_route[webrtc_reply] {
    if (has_body("application/sdp")) {
        if (!rtpengine_answer("replace-origin replace-session-connection ICE=force RTP/SAVPF DTLS=passive rtcp-mux-require")) {
            xlog("L_ERR", "RTPengine WebRTC answer failed for Call-ID $ci\n");
        }
    }
    if (t_check_status("[3-6][0-9][0-9]")) {
        rtpengine_delete();
    }
}

failure_route[webrtc_failure] {
    rtpengine_delete();
}
