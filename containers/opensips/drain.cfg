# Leamout runtime admission drain.
#
# Global flag position 0 is reserved for the node drain state. The MI command
# surface uses a bitmask, so flag 0 is controlled with mask 1.
loadmodule "gflags.so"
loadmodule "mi_fifo.so"

modparam("gflags", "initial", 0)
modparam("mi_fifo", "fifo_name", "/run/opensips/opensips_fifo")
modparam("mi_fifo", "fifo_mode", 0600)
# mi_fifo concatenates reply_dir and the client FIFO name directly, so the
# directory must end in '/'.
modparam("mi_fifo", "reply_dir", "/run/opensips/")

route[LEAMOUT_DRAIN] {
    if (is_gflag(0)) {
        xlog("L_INFO", "DRAIN: rejecting new out-of-dialog $rm Call-ID $ci from $si\n");
        send_reply(503, "Service Draining");
        exit;
    }
}
