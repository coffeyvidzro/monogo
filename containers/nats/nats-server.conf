# ─────────────────────────────────────────────────────────────
# Xtottel / Leamout NATS Server
# ─────────────────────────────────────────────────────────────

# Client connections
port: 4222

# Monitoring / health endpoint
http_port: 8222

# JetStream
jetstream {
    store_dir: "/data"
}

# Server identity
server_name: "leamout-nats"

# Logging
debug: false
trace: false
logtime: true

# Graceful shutdown
max_control_line: 4096
max_payload: 8MB
