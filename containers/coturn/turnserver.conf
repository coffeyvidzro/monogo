# ─────────────────────────────────────────────────────────────
# Leamout TURN server
# ─────────────────────────────────────────────────────────────

# TURN listener
listening-port=3478

# TLS listener
tls-listening-port=5349

# Refuse obsolete TLS versions. Certificate and key paths are injected by
# Compose so they can be rotated without rebuilding this image.
no-tlsv1
no-tlsv1_1

# Bind to all container interfaces.
listening-ip=0.0.0.0

# Relay port range.
min-port=49152
max-port=65535

# Authentication
#
# Use coturn's shared-secret mechanism so application services can issue
# short-lived TURN credentials without storing static users in this file.
lt-cred-mech=true
use-auth-secret

# The shared secret is supplied at startup as static-auth-secret through
# the Compose command. Do not commit a production secret to this file.

# Realm
#
# The production realm is supplied at startup with TURN_REALM. Keep the
# realm aligned with the public TURN hostname used by clients.

# Security
# Don't allow the server to be used as a general-purpose proxy.
no-cli
no-loopback-peers
no-multicast-peers

# Logging
simple-log
log-file=stdout

# Don't daemonize inside Docker.
no-stdout-log=false
