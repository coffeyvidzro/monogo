# Leamout TURN service. Deployment-specific settings and TLS files are
# supplied by entrypoint.sh; never put shared secrets into this image.
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Temporary credentials issued by Leamout's ICE credentials API.
# use-auth-secret enables Coturn's long-term credential mechanism internally.
use-auth-secret
fingerprint

# Do not expose a TURN administrative endpoint or allow multicast peers.
# Loopback peers are disallowed by default; "no-loopback-peers" is not a
# supported Coturn setting.
no-cli
no-multicast-peers

# Keep logs on standard output and run in the foreground for Docker.
simple-log
log-file=stdout
