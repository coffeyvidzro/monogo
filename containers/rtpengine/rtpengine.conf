[rtpengine]

# Internal SIP/application media stays on private-control. External carrier and
# browser media binds public-media and advertises the configured public address.
interface = internal/172.32.0.10;external/172.31.0.10!@RTPENGINE_PUBLIC_IP@

foreground = true
log-stderr = true
log-level = 6

# OpenSIPS NG control protocol. This is reachable only on private-control.
listen-ng = 0.0.0.0:22222

# Internal diagnostics only; Compose does not publish 8080.
listen-http = 0.0.0.0:8080

# Public RTP/RTCP media range. Must match the selected distribution Compose file exactly.
port-min = 23000
port-max = 32768

delete-delay = 0
